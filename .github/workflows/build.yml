name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-app:
    name: Build app + widget (Simulator, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        run: xcodegen generate

      - name: Show Xcode version in use
        run: xcodebuild -version

      - name: List available iOS Simulators
        run: xcrun simctl list devices available

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project CoupleCountdown.xcodeproj \
            -scheme CoupleCountdown

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if 'iPhone' in d['name']:
                      print(d['udid'])
                      sys.exit(0)
          sys.exit(1)
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Build for iOS Simulator (ad-hoc local signing)
        run: |
          # Not CODE_SIGNING_ALLOWED=NO (fully unsigned): that build has
          # zero entitlements at all, which breaks even basic Keychain
          # access — confirmed via a real run, where Firebase Auth's
          # internal session-persistence write failed with
          # "SecItemAdd (-34018) A required entitlement isn't present."
          # CODE_SIGN_IDENTITY=- is ad-hoc local signing ("Sign to Run
          # Locally" in Xcode's UI) — Simulator accepts it without any
          # real Apple Developer account, and it's enough to get a valid
          # entitlements set embedded.
          xcodebuild build \
            -project CoupleCountdown.xcodeproj \
            -scheme CoupleCountdown \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES

      - name: Boot simulator, install, launch, and screenshot the app
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}"
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          # One run took ~100s to boot (first-time account/keyboard/video
          # data migrations) — bootstatus already waits for "Finished",
          # but a small buffer here guards against installing/launching
          # into a simulator that reports booted a moment before it's
          # actually ready.
          sleep 5

          APP_PATH=$(find DerivedData -name "CoupleCountdown.app" -path "*iphonesimulator*" | head -1)
          echo "App bundle: $APP_PATH"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP_PATH"

          mkdir -p logs
          # `log stream` is a supplementary diagnostic only — it does NOT
          # gate pass/fail. Previously `simctl launch --console-pty` was
          # relied on for both the stream AND the launch confirmation,
          # and one run killed it via timeout before it ever printed
          # anything, giving zero signal either way (was it slow, or did
          # it fail?). Separating the two fixes that ambiguity.
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log stream \
            --level debug --style compact \
            --predicate 'process == "CoupleCountdown"' \
            > logs/app-console.log 2>&1 &
          LOG_PID=$!
          sleep 2

          # Plain (non-console) launch — this is what every prior
          # successful run's confirmation line actually came from. Not
          # backgrounded and not `|| true`: GitHub Actions runs with
          # `set -e`, so a real launch failure now fails this step
          # immediately and visibly instead of silently falling through
          # to a screenshot of the home screen with a misleading "passed"
          # status.
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" com.couplecountdown.app

          sleep 25

          mkdir -p screenshots
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot screenshots/app-launch.png

          kill "$LOG_PID" 2>/dev/null || true
          echo "--- app log stream ---"
          cat logs/app-console.log || true

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshot
          path: screenshots/
          if-no-files-found: warn

      - name: Run XCUITest suite (real Firestore/Auth backend, no mocks)
        run: |
          # `set -o pipefail`, not assumed default: a prior run proved the
          # default GitHub Actions bash shell does NOT enable it, so
          # `xcodebuild test | tee ...` silently reported this step as
          # green while xcodebuild had actually failed at codesigning
          # before running a single test — a real false-pass, not a
          # hypothetical one.
          set -o pipefail
          mkdir -p logs
          # Reuses the simulator already booted above. Each test launches
          # its own app instance with "-uiTestReset" (see
          # CoupleCountdownApp.init()), so tests don't depend on each
          # other or on the screenshot step's launch above.
          xcodebuild test \
            -project CoupleCountdown.xcodeproj \
            -scheme CoupleCountdown \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            | tee logs/uitest-output.log

      - name: Upload UI test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uitest-results
          path: TestResults.xcresult
          if-no-files-found: warn

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-logs
          path: logs/
          if-no-files-found: ignore

  build-device-ipa:
    name: Build unsigned .ipa for real-device sideloading (SideStore/AltStore)
    runs-on: macos-latest
    # Only for pushes to main / manual runs — never for PRs, so an
    # untrusted/in-progress branch can't publish over the release a real
    # device might be about to install from.
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        run: xcodegen generate

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project CoupleCountdown.xcodeproj \
            -scheme CoupleCountdown

      - name: Build for a real iOS device (unsigned)
        run: |
          # Deliberately unsigned, not ad-hoc: SideStore/AltStore strip
          # whatever signature is present and re-sign the whole app with
          # the user's own free Apple ID at install time, so there's
          # nothing for a CI-applied signature to accomplish here — this
          # is the standard, well-established shape for an IPA meant to
          # be sideloaded rather than distributed through the App Store.
          # (Simulator builds elsewhere in this workflow need ad-hoc
          # signing for a different reason: the Simulator itself enforces
          # entitlements for things like Keychain access even without a
          # real device, which doesn't apply here.)
          xcodebuild build \
            -project CoupleCountdown.xcodeproj \
            -scheme CoupleCountdown \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload/CoupleCountdown.app into an .ipa
        id: package
        run: |
          APP_PATH=$(find DerivedData -name "CoupleCountdown.app" -path "*iphoneos*" | head -1)
          echo "App bundle: $APP_PATH"
          mkdir -p ipa-build/Payload
          cp -R "$APP_PATH" ipa-build/Payload/
          (cd ipa-build && zip -qr ../CoupleCountdown.ipa Payload)
          echo "size=$(stat -f%z CoupleCountdown.ipa)" >> "$GITHUB_OUTPUT"

      - name: Generate an AltStore/SideStore source manifest
        env:
          IPA_SIZE: ${{ steps.package.outputs.size }}
        run: node .github/scripts/generate-altsource.js

      - name: Publish/update the "latest" GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Rolling release: same tag every time, so the SideStore source
          # URL and a bookmarked download link never change across builds.
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            CoupleCountdown.ipa source.json \
            --title "Latest build ($(git rev-parse --short HEAD))" \
            --notes "Automatically built from the latest push to main. Unsigned — install via SideStore or AltStore, which re-sign it with your own free Apple ID at install time." \
            --latest

  test-kit-package:
    name: Run CoupleCountdownKit unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: swift test
        working-directory: CoupleCountdownKit
        run: swift test

  test-firestore-rules:
    name: Run Firestore Security Rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: firebase
        run: npm ci

      - name: npm test
        working-directory: firebase
        run: npm test
