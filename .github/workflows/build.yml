name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-app:
    name: Build app + widget (Simulator, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        run: xcodegen generate

      - name: Show Xcode version in use
        run: xcodebuild -version

      - name: List available iOS Simulators
        run: xcrun simctl list devices available

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project CoupleCountdown.xcodeproj \
            -scheme CoupleCountdown

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if 'iPhone' in d['name']:
                      print(d['udid'])
                      sys.exit(0)
          sys.exit(1)
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Build for iOS Simulator (no code signing)
        run: |
          xcodebuild build \
            -project CoupleCountdown.xcodeproj \
            -scheme CoupleCountdown \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot simulator, install, launch, and screenshot the app
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}"
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

          APP_PATH=$(find DerivedData -name "CoupleCountdown.app" -path "*iphonesimulator*" | head -1)
          echo "App bundle: $APP_PATH"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP_PATH"

          mkdir -p logs
          # --console-pty streams the app's own stdout/stderr (print(),
          # os_log, uncaught-exception traces) directly — far more useful
          # than system-wide `log collect`, which failed outright last
          # run (tried to create logs/system.logarchive as a directory
          # and errored). Backgrounded with a fixed capture window rather
          # than blocking, since simctl launch --console-pty runs
          # indefinitely until the app exits.
          xcrun simctl launch --console-pty "${{ steps.sim.outputs.udid }}" com.couplecountdown.app \
            > logs/app-console.log 2>&1 &
          CONSOLE_PID=$!

          # Give it time to sign in (real Anonymous Auth network call) and
          # render — no fixed "app is ready" signal available here, so a
          # flat wait is the simplest reliable option.
          sleep 25

          mkdir -p screenshots
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot screenshots/app-launch.png

          kill "$CONSOLE_PID" 2>/dev/null || true
          echo "--- app console output ---"
          cat logs/app-console.log || true

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshot
          path: screenshots/
          if-no-files-found: warn

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-logs
          path: logs/
          if-no-files-found: ignore

  test-kit-package:
    name: Run CoupleCountdownKit unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: swift test
        working-directory: CoupleCountdownKit
        run: swift test

  test-firestore-rules:
    name: Run Firestore Security Rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: firebase
        run: npm ci

      - name: npm test
        working-directory: firebase
        run: npm test
