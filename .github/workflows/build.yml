name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-app:
    name: Build app + widget (Simulator, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        run: xcodegen generate

      - name: Show Xcode version in use
        run: xcodebuild -version

      - name: List available iOS Simulators
        run: xcrun simctl list devices available

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project CoupleCountdown.xcodeproj \
            -scheme CoupleCountdown

      - name: Build for iOS Simulator (no code signing)
        run: |
          xcodebuild build \
            -project CoupleCountdown.xcodeproj \
            -scheme CoupleCountdown \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  test-kit-package:
    name: Run CoupleCountdownKit unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: swift test
        working-directory: CoupleCountdownKit
        run: swift test

  test-firestore-rules:
    name: Run Firestore Security Rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: firebase
        run: npm ci

      - name: npm test
        working-directory: firebase
        run: npm test
