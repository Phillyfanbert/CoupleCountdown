# project.yml — declarative Xcode project spec (XcodeGen), so the real
# .xcodeproj can be generated by CI (or anyone) without ever opening
# Xcode's GUI. Run `xcodegen generate` to produce CoupleCountdown.xcodeproj
# — that generated project is NOT committed (see .gitignore); this file is
# the single source of truth for project structure (DESIGN.md §5.6).
#
# Bundle IDs / App Group / Keychain group below are placeholders — none of
# this is real until an actual Apple Developer identity signs it, per the
# same reasoning DESIGN.md gave for not hand-authoring these earlier.

name: CoupleCountdown
options:
  bundleIdPrefix: com.couplecountdown
  deploymentTarget:
    iOS: "17.0"

packages:
  CoupleCountdownKit:
    path: CoupleCountdownKit
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

targets:
  CoupleCountdown:
    type: application
    platform: iOS
    sources:
      - path: CoupleCountdown
    dependencies:
      - package: CoupleCountdownKit
        product: CoupleCountdownKit
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseCore
      - target: CoupleCountdownWidgetExtension
        embed: true
    info:
      path: Generated/CoupleCountdown-Info.plist
      properties:
        CFBundleDisplayName: CoupleCountdown
        UILaunchScreen: {}
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - com.couplecountdown.refresh
    entitlements:
      path: Generated/CoupleCountdown.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.couplecountdown.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.couplecountdown.shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.couplecountdown.app
      SWIFT_VERSION: "5.0"

  CoupleCountdownWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: CoupleCountdownWidget
    dependencies:
      - package: CoupleCountdownKit
        product: CoupleCountdownKit
    info:
      path: Generated/CoupleCountdownWidget-Info.plist
      properties:
        CFBundleDisplayName: CoupleCountdown Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/CoupleCountdownWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.couplecountdown.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.couplecountdown.shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.couplecountdown.app.widget
      SWIFT_VERSION: "5.0"
